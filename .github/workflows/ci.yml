name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build FileManager.csproj -c Release

      - name: Test
        run: dotnet test tests/ByteCommander.Tests -c Release --logger "trx;LogFileName=results.trx" --logger "console;verbosity=normal"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/ByteCommander.Tests/TestResults/*.trx

      - name: Publish app
        run: dotnet publish FileManager.csproj -c Release -r win-x64 --self-contained false -o publish

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: ByteCommander-win-x64
          path: publish/
