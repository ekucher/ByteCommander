name: Release

# Реліз створюється пушем тегу: git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Version from tag
        id: ver
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test tests/ByteCommander.Tests -c Release

      - name: Publish
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $common = @('-c', 'Release', '-r', 'win-x64', '-p:PublishSingleFile=true', '-p:DebugType=none', "-p:Version=$v")
          dotnet publish FileManager.csproj @common --self-contained false -o out/fd
          dotnet publish FileManager.csproj @common --self-contained true `
            -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o out/sc
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item LICENSE out/fd/; Copy-Item LICENSE out/sc/
          Compress-Archive out/fd/* "dist/ByteCommander-$v-win-x64.zip"
          Compress-Archive out/sc/* "dist/ByteCommander-$v-win-x64-selfcontained.zip"
          Get-ChildItem dist/*.zip | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $notes = @"
          ## Завантаження

          | Файл | Для кого |
          |---|---|
          | ``ByteCommander-$v-win-x64-selfcontained.zip`` | **Рекомендовано.** Розпакуйте й запустіть ``ByteCommander.exe`` — нічого встановлювати не треба |
          | ``ByteCommander-$v-win-x64.zip`` | Маленький (менше 1 МБ), потрібен [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0) |
          | ``SHA256SUMS.txt`` | Контрольні суми для перевірки завантаження |

          Windows 10/11 x64. Файл не підписаний цифровим підписом, тож SmartScreen може показати «Windows захистив ваш ПК» —
          натисніть **Докладніше → Виконати однаково**.
          "@
          $flags = @()
          if ($v.Contains('-')) { $flags += '--prerelease' }
          gh release create '${{ github.ref_name }}' dist/*.zip dist/SHA256SUMS.txt `
            --title "Byte Commander ${{ github.ref_name }}" --notes $notes --generate-notes @flags
